<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b14" />
    <title>Pólis</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0b14; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: Verdana, Geneva, sans-serif; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
      #resumao { position: fixed; inset: 0; background: #fbf8f1; color: #1a1a1a; overflow: auto; display: none; z-index: 10; padding: 24px 32px; box-sizing: border-box; }
      #resumao.open { display: block; }
      #resumao h1 { font-size: 22px; margin: 0 0 4px; }
      #resumao h2 { font-size: 15px; margin: 22px 0 6px; border-bottom: 1px solid #c9b99a; padding-bottom: 3px; }
      #resumao h3 { font-size: 13px; margin: 12px 0 4px; }
      #resumao p { font-size: 12.5px; line-height: 1.5; margin: 4px 0; max-width: 720px; }
      #resumao .meta { color: #6b5c3e; font-size: 11px; }
      #resumao .bar { position: sticky; top: 0; background: #fbf8f1; padding: 6px 0 10px; display: flex; gap: 8px; }
      #resumao button { font: inherit; font-size: 12px; padding: 6px 12px; border: 1px solid #6b5c3e; background: #fff; border-radius: 4px; cursor: pointer; }
      @media print { #resumao .bar { display: none; } #resumao { position: static; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="resumao"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
